<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@100;200;300;400;500;600;700&display=swap');
        
        :root {
            --gold: #d4af37;
            --dark: #0a0a0a;
        }
        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .font-display { font-family: 'Cormorant Garamond', serif; }
        .text-gold { color: var(--gold); }
        .bg-gold { background-color: var(--gold); }
        .border-gold { border-color: var(--gold); }
        
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .glass-ultra {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gold); }
    </style>
    
    <!-- React, ReactDOM, Framer Motion, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

        const WorkGallery = () => {
            const { motion, AnimatePresence } = window.Motion;
            const [activeCategory, setActiveCategory] = useState(null);
            const [activeImageIndex, setActiveImageIndex] = useState(0);
            const [isLightboxOpen, setIsLightboxOpen] = useState(false);

            const openLightbox = (idx) => { setActiveImageIndex(idx); setIsLightboxOpen(true); };

            return (
                <section className="py-32 bg-black" id="gallery">
                    <div className="container mx-auto px-6">
                        <div className="mb-20 text-center">
                            <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} className="text-gold uppercase tracking-[0.4em] text-xs mb-4">Portfolio</motion.h2>
                            <motion.h3 initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} className="text-5xl font-display text-white">Categories</motion.h3>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                            {categories.map((cat, idx) => (
                                <motion.div
                                    key={cat.id}
                                    whileHover={{ scale: 1.05, rotateY: 10, rotateX: -5 }}
                                    style={{ transformStyle: "preserve-3d", perspective: "1000px" }}
                                    onClick={() => setActiveCategory(cat)}
                                    className="relative aspect-[4/5] rounded-xl overflow-hidden group cursor-pointer glass-ultra shadow-2xl"
                                >
                                    <img src={cat.images[cat.coverIndex || 0].thumb} className="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-100 group-hover:scale-110 transition-all duration-700" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex items-end p-6">
                                        <h4 className="text-xl font-display text-white uppercase tracking-widest leading-none">{cat.name}</h4>
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                    
                    <AnimatePresence>
                        {activeCategory && !isLightboxOpen && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-[110] bg-black overflow-y-auto p-12 pt-32">
                                <button onClick={() => setActiveCategory(null)} className="fixed top-8 right-8 text-white z-[120] text-4xl">&times;</button>

                                <div className="columns-1 md:columns-3 lg:columns-4 gap-6 space-y-6 max-w-7xl mx-auto">
                                    {activeCategory.images.map((img, idx) => (
                                        <motion.img 
                                            key={idx} 
                                            src={img.thumb} 
                                            onClick={() => openLightbox(idx)} 
                                            whileHover={{ scale: 1.02 }}
                                            className="w-full rounded-xl cursor-pointer shadow-2xl hover:brightness-110 transition-all" 
                                        />
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    <AnimatePresence>
                        {isLightboxOpen && activeCategory && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-[130] bg-black/95 backdrop-blur-2xl flex items-center justify-center p-4" onClick={() => setIsLightboxOpen(false)}>

        const HomePage = ({ setCurrentPage }) => {
            const { motion, useMotionValue, useSpring, useTransform } = window.Motion;
            const containerRef = useRef(null);
            const mouseX = useMotionValue(0);
            const mouseY = useMotionValue(0);
            const springX = useSpring(mouseX, { stiffness: 40, damping: 20 });
            const springY = useSpring(mouseY, { stiffness: 40, damping: 20 });
            
            const rotateX = useTransform(springY, [-0.5, 0.5], [10, -10]);
            const rotateY = useTransform(springX, [-0.5, 0.5], [-10, 10]);
            const translateX = useTransform(springX, [-0.5, 0.5], [-20, 20]);
            const translateY = useTransform(springY, [-0.5, 0.5], [-20, 20]);

            const handleMouseMove = (e) => {
                const rect = containerRef.current?.getBoundingClientRect();
                if (rect) {
                    mouseX.set((e.clientX - rect.left) / rect.width - 0.5);
                    mouseY.set((e.clientY - rect.top) / rect.height - 0.5);
                }
            };

            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                    <section 
                        ref={containerRef}
                        onMouseMove={handleMouseMove}
                        className="relative h-screen w-full flex items-center justify-center bg-black overflow-hidden"

                            </p>

                    </div>
                </motion.div>
            );

        const ContactPage = () => {
            const { motion } = window.Motion;
            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="pt-48 pb-24 min-h-screen">
                    <div className="container mx-auto px-6 text-center">
                        <motion.h2 initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="text-gold uppercase tracking-[0.6em] text-[10px] mb-8">Inquiry</motion.h2>
                        <motion.h1 initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="text-6xl md:text-[6rem] font-display italic text-white mb-24">Let's Create Together</motion.h1>

                            </motion.div>
                            <motion.div initial={{ opacity: 0, x: 30 }} animate={{ opacity: 1, x: 0 }} className="flex flex-col justify-center space-y-16 pl-12">
                                <div>
                                    <h4 className="text-white/30 text-[10px] uppercase tracking-[0.6em] mb-6">Instagram</h4>
                                    <a href="https://www.instagram.com/shoot_with_anand?igsh=MTBtY2w2bTByMmF5bg==" target="_blank" className="text-3xl text-white hover:text-gold transition-all duration-500 italic font-display">@shoot_with_anand</a>
                                </div>
                                <div>
                                    <h4 className="text-white/30 text-[10px] uppercase tracking-[0.6em] mb-6">LinkedIn</h4>
                                    <a href="https://www.linkedin.com/in/deepanshu-anand-386990408?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" className="text-3xl text-white hover:text-gold transition-all duration-500 italic font-display">Deepanshu Anand</a>
                                </div>
                            </motion.div>
                        </div>
                    </div>
                </motion.div>
            );
        };

        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [currentPage, setCurrentPage] = useState('home');
            const { AnimatePresence, motion } = window.Motion;

            useEffect(() => {
                const timer = setTimeout(() => setShowIntro(false), 3000);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div className="min-h-screen bg-[#0a0a0a] text-white selection:bg-gold selection:text-black">
                    <div className="noise-overlay" />
                    <AnimatePresence mode="wait">
                        {showIntro ? <IntroScreen key="intro" /> : (
                            <motion.div key="main" initial={{ opacity: 0 }} animate={{ opacity: 1 }}>
                                <Navbar currentPage={currentPage} setCurrentPage={setCurrentPage} />
                                <AnimatePresence mode="wait">
                                    {currentPage === 'home' && <HomePage key="home" setCurrentPage={setCurrentPage} />}
                                    {currentPage === 'about' && <AboutPage key="about" />}
                                    {currentPage === 'diploma' && <DiplomaPage key="diploma" />}
                                    {currentPage === 'contact' && <ContactPage key="contact" />}
                                </AnimatePresence>
                                <footer className="py-24 border-t border-white/5 text-center bg-black">
                                    <h2 className="text-3xl font-display font-bold italic mb-6">Shoot with <span className="text-gold">Anand</span></h2>
                                    <p className="text-white/20 text-[10px] tracking-[0.4em] uppercase">© 2026 Studio Portfolio. Crafted with Precision.</p>
                                </footer>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
